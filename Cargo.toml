cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "3"
members = ["crates/ingot-primitives"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Stefan Bader"]

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

print_stdout = "warn"
print_stderr = "warn"

pedantic = { level = "warn", priority = -1 }
# Disabling specific pedantic lints that are often considered too noisy:
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

[profile.bench]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "unwind"
rpath = false
strip = true

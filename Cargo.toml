cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "3"
members = [
    "crates/ingot-accounting",
    "crates/ingot-connectivity",
    "crates/ingot-core", "crates/ingot-engine",
    "crates/ingot-primitives",
    "crates/ingot-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Stefan Bader"]

[workspace.dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }
hmac = { version = "0.13.0-rc.6", default-features = false }
ingot-core = { version = "0.1.0", path = "crates/ingot-core" }
ingot-primitives = { version = "0.1.0", path = "crates/ingot-primitives" }
proptest = { version = "1.10.0", default-features = false, features = ["std"] }
rand = { version = "0.10.0", default-features = false, features = ["std", "std_rng", "sys_rng"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "query"] }
rust_decimal = { version = "1.40.0", default-features = false, features = ["serde", "std"] }
rust_decimal_macros = { version = "1.40.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0-rc.5", default-features = false }
smol_str = { version = "0.3.6", default-features = false, features = ["serde"] }
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "json", "macros", "derive", "migrate", "uuid"] }
testcontainers = { version = "0.27.1", default-features = false }
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["postgres"] }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
url = { version = "2.5.8", default-features = false }
uuid = { version = "1.22.0", default-features = false, features = ["v7", "serde"] }
wiremock = { version = "0.6.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

print_stdout = "warn"
print_stderr = "warn"

pedantic = { level = "warn", priority = -1 }
# Disabling specific pedantic lints that are often considered too noisy:
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

[profile.bench]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "unwind"
rpath = false
strip = true
